[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-local"
version = "0.0.1"
description = "Local-first creative media harvesting"
requires-python = ">=3.11"
dependencies = [
  "browser-cookie3>=0.20,<1",
  "instaloader>=4.15,<5",
]

[project.scripts]
harvest = "harvest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
