[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harvester"
version = "1.0.0"
description = "Local-first creative media harvesting"
requires-python = ">=3.11"
dependencies = [
  "browser-cookie3>=0.20,<1",
  "instaloader>=4.15,<5",
]

[project.scripts]
harvester = "harvester.cli:main"
harvester-native-host = "harvester.native_host:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
