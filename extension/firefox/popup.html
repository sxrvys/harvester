<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>harvester</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header><img src="icons/glyph-dark.svg" alt=""><span>harvester</span></header>
    <p id="page" class="page">Current page unavailable</p>
    <div id="queue-controls" hidden>
      <label for="bundle-name">Name (optional)</label>
      <input id="bundle-name" type="text" maxlength="100" placeholder="Use the source title">
      <details>
        <summary>Clip and storage options</summary>
        <label for="clip-start">Start (seconds or HH:MM:SS)</label>
        <input id="clip-start" type="text" placeholder="0:00">
        <label for="clip-end">End (optional)</label>
        <input id="clip-end" type="text" placeholder="Full video">
        <label for="video-preset">Video</label>
        <select id="video-preset"><option value="h264_all_keyframes">All-keyframe H.264</option><option value="h264_small">Smaller H.264</option></select>
        <label for="audio-preset">Audio</label>
        <select id="audio-preset"><option value="wav_48k_24">24-bit WAV</option><option value="flac_48k_24">FLAC — lossless, smaller</option></select>
        <p class="hint">Trimming still downloads the full source. Limits: 60 minutes / 500 MB.</p>
      </details>
    </div>
    <button id="harvest" type="button" disabled>Harvest this</button>
    <button id="add-queue" class="secondary" type="button" hidden>Add to queue</button>
    <button id="select-media" type="button" hidden>Select visible media</button>
    <p id="picker-note" class="hint" hidden>Player selection uses your Firefox output settings. Naming and clip options above apply to page harvests.</p>
    <p id="status" class="status" role="status">Checking local companion…</p>
    <button id="open-output" class="secondary" type="button">Open output folder</button>
    <button id="local-file" class="secondary" type="button">Harvest local file</button>
    <button id="archival" class="secondary" type="button">Archival Harvest</button>
    <button id="settings" class="secondary" type="button">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
